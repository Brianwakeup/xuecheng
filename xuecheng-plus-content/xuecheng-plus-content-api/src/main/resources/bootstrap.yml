#只留下服务单独的配置以及需要注册到nacos的配置和读取配置文件的配置
spring:
  application:
    name: content-api   #服务名称
  profiles:
    active: dev   #运行环境
  cloud:
    nacos:
      discovery:
        namespace: dev
        group: xuecheng-plus-project  #组名
      server-addr: 192.168.36.111:8848   #nacos地址
      config:
        namespace: dev  #命名空间
        file-extension: yaml  #文件名后缀
        refresh-enabled: true
        group: xuecheng-plus-project
        extension-configs:
          - data-id: content-service-${spring.profiles.active}.yaml
            group: xuecheng-plus-project
            refresh: true

