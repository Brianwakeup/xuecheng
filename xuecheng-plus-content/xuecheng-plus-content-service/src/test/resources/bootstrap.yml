spring:
  application:
    name: content-service   #服务名称
  profiles:
    active: dev   #运行环境
  cloud:
    nacos:
      server-addr: 192.168.36.111:8848   #nacos地址
      discovery:
        group: xuecheng-plus-project
        namespace: dev
      config:
        namespace: dev  #命名空间
        file-extension: yaml  #文件名后缀
        refresh-enabled: true
        group: xuecheng-plus-project
        shared-configs:
          - data-id: feign-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true
